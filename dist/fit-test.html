<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>fit test</title>
<style>
  body { margin:0; font-family:sans-serif; background:#faf5ef; }
  h2 { margin:24px 16px 8px; }
  /* Legacy-Regeln aus liquid-glass-v3-10.css nachgestellt */
  .variant-split transformance-hero { display:block; transform:scale(0.62); transform-origin:center center; margin:-90px -175px; }
  /* Kontext A: schmale Split-Spalte (479px) */
  .colA { width:479px; overflow:hidden; display:flex; justify-content:center; align-items:center; outline:2px dashed #c00; }
  /* Kontext B: breite zentrierte Spalte (1100px) */
  .colB { width:1100px; margin:0 auto; display:flex; justify-content:center; outline:2px dashed #06c; }
</style></head>
<body>
<h2>A) Split-Spalte 479px + Legacy-CSS aktiv</h2>
<section class="variant-split"><div class="colA"><transformance-hero style="display:block"></transformance-hero></div></section>
<h2>B) Breite Spalte 1100px + Legacy-CSS aktiv</h2>
<section class="variant-split"><div class="colB"><transformance-hero style="display:block"></transformance-hero></div></section>
<script src="./player.js"></script>
</body></html>
